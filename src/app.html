<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>汉字笔顺练习纸生成器</title>
<style>
:root{--bg:#e9e9ec;--panel:#fff;--card:#f5f5f7;--ink:#222;--muted:#666;--line:#d0d0d6;--accent:#c0392b;--accent-bg:#fdeceb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#232327;--panel:#34343a;--card:#2a2a30;--ink:#eee;--muted:#aaa;--line:#55555d;--accent:#e05a4d;--accent-bg:#472927}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.ui{background:var(--panel);padding:12px 14px;border-bottom:1px solid var(--line)}
.ui h1{font-size:17px;margin:0 0 8px}
textarea{width:100%;box-sizing:border-box;font-size:20px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-family:inherit;resize:vertical}
.opts{display:flex;flex-wrap:wrap;gap:10px 16px;margin:8px 0;font-size:14px;align-items:center}
select,input[type=text],input[type=date]{font-size:14px;padding:4px 7px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.dt-grp{display:inline-flex;align-items:center;gap:6px}
.dt-auto{display:inline-flex;align-items:center;gap:4px;cursor:pointer;user-select:none}
.dt-auto input{margin:0;accent-color:var(--accent)}
button.alt{background:#555}button:disabled{opacity:.5}button{font-size:15px;padding:8px 18px;border:0;border-radius:8px;background:#c0392b;color:#fff;cursor:pointer}
button.mini{font-size:12px;padding:3px 8px;border-radius:6px;background:#666;color:#fff;line-height:1.4}
button.mini.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
#poly{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.pcard.off{opacity:.65;border-style:dashed}
.pcard-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.pchar{font-size:20px;font-weight:700;min-width:24px}
.ptag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:14px;cursor:pointer;user-select:none}
.ptag input{margin:0;accent-color:var(--accent)}
.ptag.on{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);font-weight:600}
.ptag .px,.wchip .wx{background:none;border:0;color:inherit;opacity:.65;padding:0 2px;font-size:14px;line-height:1;cursor:pointer}
.ptag .px:hover,.wchip .wx:hover{opacity:1}
.padd-py{display:inline-flex;align-items:center;gap:4px;margin-left:auto}
.padd-py input{width:76px;font-size:13px;padding:3px 6px}
.pw-list{display:flex;flex-direction:column;gap:6px;margin-top:7px;padding-top:7px;border-top:1px dashed var(--line)}
.pw-row{display:flex;flex-wrap:wrap;align-items:center;gap:5px 6px;font-size:13px}
.pw-py{font-weight:600;color:var(--accent);min-width:44px;font-family:Arial,"PingFang SC",sans-serif}
.pw-py.py-edit{cursor:pointer;border-bottom:1px dashed currentColor;min-width:0;padding:0 2px}
.py-inp{width:64px;font-size:13px;padding:1px 5px}
.srow .px{background:none;border:0;color:var(--muted);padding:0 2px;font-size:13px;line-height:1;cursor:pointer}
.srow .px:hover{color:var(--accent)}
.wchip{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:6px;background:var(--panel);border:1px solid var(--line);font-size:14px}
.wempty{font-size:12px;color:var(--muted)}
.wadd{width:84px;font-size:13px;padding:2px 6px}
.sbox{margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.sbox summary{font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.slist{display:flex;flex-direction:column;gap:6px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.srow{display:flex;flex-wrap:wrap;align-items:center;gap:5px 6px;font-size:13px}
.srow.off{opacity:.55}
.srow .pchar{font-size:18px;min-width:20px}
.stag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:var(--panel)}
.stag.on{border-color:var(--accent);background:var(--accent-bg)}
.stag .s-cb{margin:0;accent-color:var(--accent);cursor:pointer}
#msg{font-size:13px;color:#c0392b;margin-top:6px;min-height:1em}
.tip{font-size:12px;opacity:.7;margin-top:4px}
.wrap{padding:12px 0;overflow:hidden}
.sheet{background:#fff;color:#222;width:210mm;height:297mm;margin:0 auto 12px;padding:10mm 13.25mm;box-sizing:border-box;page-break-after:always;overflow:hidden;font-family:"Kaiti SC","KaiTi","PingFang SC",sans-serif}
.top{height:8mm;font-size:11pt;display:flex;justify-content:space-between;align-items:baseline;color:#555}
.top-r{display:inline-flex;align-items:baseline;white-space:nowrap}
.u{display:inline-block;border-bottom:.3mm solid #555;padding:0 .6mm .35mm;line-height:1.1;text-align:center;box-sizing:border-box}
.u.dt-val{padding:0 1.2mm .35mm}
.head{height:8.5mm;display:flex;align-items:baseline;justify-content:space-between;gap:4mm}
.py-line{--sc:1;--py-pt:17pt;flex:1;min-width:0;overflow:hidden;white-space:nowrap}
.py-line.multi{--py-pt:15.5pt}
.py-in{display:inline-flex;align-items:baseline;white-space:nowrap}
.py-item{display:inline-flex;align-items:baseline;margin-right:calc(4.5mm * var(--sc))}
.py-item:last-child{margin-right:0}
.py{font-family:Arial,"PingFang SC",sans-serif;font-size:calc(var(--py-pt) * var(--sc));color:#c0392b}
.wd{font-size:calc(13.5pt * var(--sc));color:#333;margin-left:calc(1.8mm * var(--sc))}
.meta{font-size:9pt;color:#888;flex:none;white-space:nowrap}
.row{display:flex}
.row.steps-r2{margin-top:-.35mm}
.row.blank-row:last-child{margin-bottom:0!important}
.cell{box-sizing:border-box;border:.35mm solid #444;flex:none;margin-right:-.35mm}
.sheet[data-sheet="back"]{--cm:17mm;--pyh:6.2mm;--pypt:11.5pt}
.drow{display:flex;align-items:flex-end}
.wgrp{display:inline-flex;flex-direction:column;flex:none}
.wgrp .cell:last-child,.wgrp .wpy-cell:last-child{margin-right:0}
.wpy-row{display:flex;align-items:flex-end;height:var(--pyh)}
.wpy-cell{width:var(--cm);flex:none;margin-right:-.35mm;box-sizing:border-box;display:flex;justify-content:center;align-items:flex-end;padding-bottom:calc(var(--pyh) * 0.16)}
.wpy{font-family:Arial,"PingFang SC",sans-serif;font-size:var(--pypt);line-height:1.1;color:#222;white-space:nowrap;padding:0 2px;border-radius:3px}
.wpy.poly-py{cursor:pointer;text-decoration:underline dotted rgba(192,57,43,.55);text-underline-offset:2px}
.wpy.poly-py:hover{background:rgba(192,57,43,.1);color:#c0392b}
.ref-bar{height:9mm;margin-bottom:2.5mm;box-sizing:border-box;border:.25mm solid #ccc;background:#fff;display:flex;align-items:center;padding:0 3mm}
.ref-lbl{font-size:10pt;line-height:1.2;color:#666;white-space:nowrap;flex:none;width:19mm}
.ref-list{display:flex;align-items:center;gap:5.5mm;flex:1;min-width:0}
.ref-ch{flex:none;width:6.8mm;height:6.8mm}
svg{display:block}
@media (pointer:coarse){select,input[type=text],input[type=date],.padd-py input,.wadd,.py-inp{font-size:16px}}
@page{size:A4;margin:0}
@media print{body{background:#fff}.ui{display:none}.wrap{padding:0;overflow:visible;height:auto!important}#root{transform:none!important;width:auto!important;margin-left:0!important}.sheet{margin:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}.sheet:last-child{page-break-after:auto;break-after:auto}.wpy.poly-py{cursor:default;background:transparent!important;text-decoration:none!important;border:0!important;outline:0!important;box-shadow:none!important;color:#222!important}}
</style></head><body>
<div class="ui">
<h1>汉字笔顺练习纸</h1>
<textarea id="inp" rows="2" placeholder="输入生字，例如：树桥数欢园"></textarea>
<div class="opts">
<label>模式 <select id="mode"><option value="stroke" selected>笔顺</option><option value="duplex">双面（笔顺+默写）</option><option value="dictation">仅默写</option></select></label>
<button type="button" id="bshuf" class="mini" style="display:none" onclick="reshuffleDict()">乱序</button>
<label id="refWrap" class="dt-auto" style="display:none"><input type="checkbox" id="showRef" checked> 参考汉字</label>
<label>每页字数 <select id="per"><option>4</option><option>5</option><option selected>6</option></select></label>
<label id="ghostWrap">描红格 <select id="ghost"><option>0</option><option>2</option><option selected>3</option><option>4</option></select></label>
<span class="dt-grp"><label class="dt-auto"><input type="checkbox" id="dtAuto" checked> 自动日期</label><input type="date" id="dt"></span>
<button id="bprint" onclick="doPrint()">一键打印</button><button id="bpdf" class="alt" onclick="exportPdf()">导出 PDF</button><button id="bmd" class="alt" onclick="exportMd()">导出 Markdown</button>
</div>
<div id="poly"></div>
<div id="singles"></div>
<div id="msg">字库加载中…如果一直没变化，说明当前打开方式不能运行网页，请改用 Safari 或 Chrome 打开页面链接（不要用文件预览或微信内置浏览器）。</div>
<div class="tip">收录常用字约 7000 个，支持笔顺、双面（正面笔顺+反面默写）与仅默写模式，默写页顶部提供乱序参考汉字（可勾选显隐）。多音字可勾选读音、所有汉字可增删组词并实时同步反面默写，预览点击多音搭档字可切音（自动保存在本机）。打印或导出 PDF 请选 A4 纸、缩放选“实际大小”，双面打印选长边翻转。</div>
</div>
<div class="wrap"><div id="root"></div></div>
<script>
const B64="__DB__";
const $=id=>document.getElementById(id);
let DB=null;
let cfg={};
let singlesOpen=null;
let lastCharKey='';
let inpTimer=null;
const CFG_KEY='hz_poly_v1';
const MODE_KEY='hz_mode_v1';
const PARTNER_PY_KEY='hz_partner_py_v1';
const REF_KEY='hz_ref_v1';
const MODE_META={
  stroke:{title:'汉字笔顺练习',filePrefix:'汉字练习'},
  duplex:{title:'汉字笔顺练习',backTitle:'生字默写练习',filePrefix:'汉字双面练习'},
  dictation:{title:'生字默写练习',backTitle:'生字默写练习',filePrefix:'生字默写练习'}
};
const INIT_SHUFFLE_SEED=0x243f6a88;
let partnerPy={};
let shuffleSeed=INIT_SHUFFLE_SEED;
function curMode(){
  const el=$('mode');
  const v=el?el.value:'stroke';
  return MODE_META[v]?v:'stroke';
}
function isShowRef(){const el=$('showRef');return !el||el.checked;}
function syncModeUi(){
  const m=curMode();
  $('bshuf').style.display=m==='stroke'?'none':'';
  $('refWrap').style.display=m==='stroke'?'none':'';
  $('ghostWrap').style.display=m==='dictation'?'none':'';
}
function syncDateUi(){
  $('dt').style.display=$('dtAuto').checked?'':'none';
}
function loadUiState(){
  try{
    const m=localStorage.getItem(MODE_KEY);
    if(m&&MODE_META[m])$('mode').value=m;
  }catch(e){}
  try{
    const r=localStorage.getItem(REF_KEY);
    if($('showRef'))$('showRef').checked=r!=='0';
  }catch(e){}
  try{
    const raw=localStorage.getItem(PARTNER_PY_KEY);
    if(raw){const p=JSON.parse(raw);if(p&&typeof p==='object')partnerPy=p;}
  }catch(e){}
}
function savePartnerPy(){try{localStorage.setItem(PARTNER_PY_KEY,JSON.stringify(partnerPy));}catch(e){}}
function partnerPyKey(target,targetPy,word,ci){return target+':'+targetPy+':'+word+':'+ci;}
const L='stroke="#dc9a92" stroke-width="18" stroke-dasharray="26 22"';
const grid='<line x1="512" y1="0" x2="512" y2="1024" '+L+'/><line x1="0" y1="512" x2="1024" y2="512" '+L+'/>';
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function loadCfg(){
  try{const raw=localStorage.getItem(CFG_KEY);if(raw){const p=JSON.parse(raw);if(p&&typeof p==='object')cfg=p;}}catch(e){}
}
function saveCfg(){try{localStorage.setItem(CFG_KEY,JSON.stringify(cfg));}catch(e){}}
function ensureCfg(c){
  if(!cfg[c])cfg[c]={on:{},w:{},cp:[]};
  if(!cfg[c].on)cfg[c].on={};
  if(!cfg[c].w)cfg[c].w={};
  if(!Array.isArray(cfg[c].cp))cfg[c].cp=[];
  return cfg[c];
}
function allPys(c){
  const base=(DB&&DB[c])?DB[c].p:[];
  const extra=(cfg[c]&&Array.isArray(cfg[c].cp))?cfg[c].cp:[];
  return [...new Set([...base,...extra])];
}
function isCustomPy(c,p){return Boolean(DB&&DB[c]&&!DB[c].p.includes(p)&&cfg[c]&&Array.isArray(cfg[c].cp)&&cfg[c].cp.includes(p));}
function defWords(c,p){return (DB&&DB[c]&&DB[c].w&&Array.isArray(DB[c].w[p]))?DB[c].w[p]:[];}
function isDefOn(c,p){
  if(isCustomPy(c,p))return true;
  if(DB&&DB[c]&&DB[c].w)return defWords(c,p).length>0;
  return Boolean(DB&&DB[c]&&p===DB[c].p[0]);
}
function isDictOnly(){return curMode()==='dictation';}
function isRawOn(c,p){
  if(cfg[c]&&cfg[c].on&&Object.prototype.hasOwnProperty.call(cfg[c].on,p))return Boolean(cfg[c].on[p]);
  return isDefOn(c,p);
}
function isPolyAllRawOff(c){
  const pys=allPys(c);
  return pys.length>0&&!pys.some(x=>isRawOn(c,x));
}
function isOn(c,p){
  if(!isDictOnly()&&isPolyAllRawOff(c)){
    const hasDef=allPys(c).some(x=>isDefOn(c,x));
    return hasDef?isDefOn(c,p):Boolean(DB&&DB[c]&&p===DB[c].p[0]);
  }
  return isRawOn(c,p);
}
function isSingleOn(c){
  if(!isDictOnly())return true;
  return !(cfg[c]&&cfg[c].so===false);
}
function wordsOf(c,p){
  if(cfg[c]&&cfg[c].w&&Object.prototype.hasOwnProperty.call(cfg[c].w,p))return cfg[c].w[p];
  return defWords(c,p);
}
function hasWordOverride(c,p){
  if(!(cfg[c]&&cfg[c].w&&Object.prototype.hasOwnProperty.call(cfg[c].w,p)))return false;
  const a=cfg[c].w[p],b=defWords(c,p);
  return a.length!==b.length||a.some((x,i)=>x!==b[i]);
}
function isPoly(c){return Boolean(DB&&DB[c]&&(DB[c].p.length>1||(cfg[c]&&cfg[c].cp&&cfg[c].cp.length>0)));}
function singlePy(c){
  if(cfg[c]&&typeof cfg[c].sp==='string'&&cfg[c].sp.trim())return cfg[c].sp.trim();
  return (DB&&DB[c])?DB[c].p[0]:'';
}
function hasSinglePyOverride(c){return Boolean(cfg[c]&&typeof cfg[c].sp==='string'&&cfg[c].sp.trim()&&DB&&DB[c]&&cfg[c].sp.trim()!==DB[c].p[0]);}
function activeEntries(c){
  if(!DB||!DB[c])return [];
  if(!isPoly(c))return isSingleOn(c)?[{p:singlePy(c),w:wordsOf(c,DB[c].p[0])}]:[];
  return allPys(c).filter(p=>isOn(c,p)).map(p=>({p,w:wordsOf(c,p)}));
}
function setSinglePy(c,raw){
  const py=String(raw||'').trim();
  const st=ensureCfg(c);
  if(!py||(DB&&DB[c]&&py===DB[c].p[0]))delete st.sp;
  else st.sp=py;
  saveCfg();updateCharUi(c);render();
}
function toggleSingleOn(c,val){
  const next=typeof val==='boolean'?val:!isSingleOn(c);
  const st=ensureCfg(c);
  if(next)delete st.so;
  else st.so=false;
  saveCfg();updateCharUi(c,{type:'scb'});render();
}
function togglePy(c,p,val){
  const curOn=isOn(c,p);
  const next=typeof val==='boolean'?val:!curOn;
  if(!isDictOnly()&&!next&&curOn){
    const onCount=allPys(c).filter(x=>isOn(c,x)).length;
    if(onCount<=1){
      updateCharUi(c,{type:'pycb',py:p});
      $('msg').textContent='「'+c+'」至少保留一个读音';
      return;
    }
  }
  const st=ensureCfg(c);
  if(!isDictOnly()&&isPolyAllRawOff(c)){
    allPys(c).forEach(x=>{st.on[x]=isOn(c,x);});
  }
  st.on[p]=next;
  saveCfg();updateCharUi(c,{type:'pycb',py:p});render();
}
function addWords(c,p,raw){
  const parts=String(raw||'').split(/[\s,，、;；]+/).map(x=>x.trim()).filter(Boolean);
  if(!parts.length)return;
  const st=ensureCfg(c);
  const cur=[...wordsOf(c,p)];
  parts.forEach(w=>{if(!cur.includes(w))cur.push(w);});
  st.w[p]=cur;
  saveCfg();updateCharUi(c,{type:'wadd',py:p});render();
}
function delWord(c,p,word){
  const st=ensureCfg(c);
  st.w[p]=wordsOf(c,p).filter(w=>w!==word);
  saveCfg();updateCharUi(c,{type:'wadd',py:p});render();
}
function resetWords(c,p){
  if(cfg[c]&&cfg[c].w)delete cfg[c].w[p];
  saveCfg();updateCharUi(c,{type:'wadd',py:p});render();
}
function addCustomPy(c,raw){
  const py=String(raw||'').trim();
  if(!py)return;
  const wasPoly=isPoly(c);
  const st=ensureCfg(c);
  if(!isDictOnly()&&wasPoly&&isPolyAllRawOff(c)){
    allPys(c).forEach(x=>{st.on[x]=isOn(c,x);});
  }
  if(!DB[c].p.includes(py)&&!st.cp.includes(py)){
    st.cp.push(py);
    if(!Object.prototype.hasOwnProperty.call(st.w,py))st.w[py]=[];
  }
  st.on[py]=true;
  saveCfg();
  if(wasPoly)updateCharUi(c,{type:'addpy'});else buildPoly();
  render();
}
function delCustomPy(c,py){
  if(!cfg[c])return;
  if(Array.isArray(cfg[c].cp))cfg[c].cp=cfg[c].cp.filter(x=>x!==py);
  if(cfg[c].on)delete cfg[c].on[py];
  if(cfg[c].w)delete cfg[c].w[py];
  if(!isDictOnly()&&isPoly(c)&&isPolyAllRawOff(c)&&DB&&DB[c]){
    ensureCfg(c).on[DB[c].p[0]]=true;
  }
  saveCfg();
  if(isPoly(c))updateCharUi(c);else buildPoly();
  render();
}
function cell(s,upto,mode,mm){
  let g='';
  s.forEach((p,i)=>{let f=null;
    if(mode==='full')f='#222';
    else if(mode==='ghost')f='#d6d6d6';
    else if(mode==='step'){f=i<upto-1?'#c8c8c8':(i===upto-1?'#000':null);}
    if(f)g+='<path d="'+p+'" fill="'+f+'"/>';});
  return '<div class="cell" style="width:'+mm+'mm;height:'+mm+'mm"><svg viewBox="0 0 1024 1024" width="100%" height="100%">'+grid+'<g transform="translate(0,900) scale(1,-1)">'+g+'</g></svg></div>';
}
function dictCellHtml(cObj,mm){
  const sMm=mm.toFixed(2);
  if(cObj.isTarget){
    return '<div class="cell" data-role="target" data-char="'+esc(cObj.ch)+'" style="width:'+sMm+'mm;height:'+sMm+'mm"><svg viewBox="0 0 1024 1024" width="100%" height="100%">'+grid+'</svg></div>';
  }
  if(cObj.inDb){
    let g='';
    DB[cObj.ch].s.forEach(p=>{g+='<path d="'+p+'" fill="#d6d6d6"/>';});
    return '<div class="cell" data-role="partner" data-char="'+esc(cObj.ch)+'" data-fallback="0" style="width:'+sMm+'mm;height:'+sMm+'mm"><svg viewBox="0 0 1024 1024" width="100%" height="100%">'+grid+'<g transform="translate(0,900) scale(1,-1)">'+g+'</g></svg></div>';
  }
  return '<div class="cell" data-role="partner" data-char="'+esc(cObj.ch)+'" data-fallback="1" style="width:'+sMm+'mm;height:'+sMm+'mm"><svg viewBox="0 0 1024 1024" width="100%" height="100%">'+grid+'<text x="512" y="525" text-anchor="middle" dominant-baseline="central" fill="#d6d6d6" font-size="760" font-family=\'"Kaiti SC","KaiTi","STKaiti","Songti SC",serif\'>'+esc(cObj.ch)+'</text></svg></div>';
}
function chars(){const t=$('inp').value.match(/[\u4e00-\u9fff]/g)||[];return [...new Set(t)];}
function findPartnerContextPy(word,ci){
  const ch=word&&word[ci];
  if(!ch||!DB||!DB[ch])return '';
  const fallback=()=>{
    const ae=activeEntries(ch);
    if(ae.length)return ae[0].p;
    const defP=allPys(ch).find(p=>isDefOn(ch,p));
    return defP||singlePy(ch);
  };
  if(word.length<2||!isPoly(ch))return fallback();
  const all=allPys(ch);
  const onList=all.filter(p=>isOn(ch,p));

  const prevRefSig=prevPlans.map(pl=>pl.refChars.join('')).join('|');
  const canChangeDict=prevPlans.some(pl=>pl.dictItems.length>=2);
  const canChangeRef=prevPlans.some(pl=>pl.pageChars.length>=2);
  const prevPageDictSigs=prevPlans.map(pl=>pl.dictItems.map(x=>x.target+':'+x.word).join(','));

function packDictChunks(prepared,cellMm,wordGap){
  const pitch=cellMm-PAGE.BORDER;
  const maxCols=Math.max(1,Math.floor((PAGE.CONTENT_W-PAGE.BORDER)/pitch));
  const chunks=[];
  prepared.forEach(it=>{
    for(let s=0;s<it.chars.length;s+=maxCols){
      const slice=it.chars.slice(s,s+maxCols);
      chunks.push({target:it.target,targetPy:it.targetPy,word:it.word,chars:slice,w:wordW(slice.length,cellMm)});
    }
  });
  const rows=[];
  let cur=[],curX=0;
  chunks.forEach(ch=>{
    const nx=cur.length?(curX+wordGap+ch.w):ch.w;
    if(cur.length&&nx>PAGE.CONTENT_W+0.01){
      rows.push(cur);
      cur=[];curX=0;
    }
    const x=cur.length?(curX+wordGap):0;
    cur.push({...ch,x});
    curX=x+ch.w;
  });
  if(cur.length)rows.push(cur);
  return rows;
}
function layoutDictPage(items,refChars){
  const hasRef=Array.isArray(refChars)&&refChars.length>0;
  const refH=hasRef?DICT_BASE.REF_H:0;
  const refGap=hasRef?DICT_BASE.REF_GAP:0;
  const refList=hasRef?refChars.slice():[];
  const availH=PAGE.BODY_H-refH-refGap;
  if(!items||!items.length){
    return {cellMm:DICT_BASE.CELL,pyH:DICT_BASE.PY_H,pyPt:DICT_BASE.PY_PT,wordGap:DICT_BASE.WORD_GAP,rowGap:DICT_BASE.ROW_GAP,hasRef,refChars:refList,refH,refGap,rows:[],items:[]};
  }
  const prepared=items.map(it=>({
    ...it,
    chars:Array.from(it.word,(ch,ci)=>({
      ch,ci,
      isTarget:ch===it.target,
      inDb:Boolean(DB&&DB[ch]),
      py:resolveDictCellPy(it.target,it.targetPy,it.word,ci),
      polyPartner:ch!==it.target&&Boolean(DB&&DB[ch]&&allPys(ch).length>1)
    }))
  }));
  const tryFit=(cellMm,pyH,pyPt,wordGap,maxRowGap,minRowGap)=>{
    const packed=packDictChunks(prepared,cellMm,wordGap);
    const n=packed.length;
    const rowH=pyH+cellMm;
    if(n===0)return null;
    if(n===1){
      if(rowH<=availH+1e-6)return {cellMm,pyH,pyPt,wordGap,rowGap:0,packed};
      return null;
    }
    const slack=(availH-n*rowH)/(n-1);
    if(slack>=minRowGap-1e-6){
      const rowGap=Math.max(minRowGap,Math.min(maxRowGap,Math.floor(slack*10)/10));
      if(n*rowH+(n-1)*rowGap<=availH+1e-6){
        return {cellMm,pyH,pyPt,wordGap,rowGap,packed};
      }
    }
    return null;
  };
  let best=tryFit(DICT_BASE.CELL,DICT_BASE.PY_H,DICT_BASE.PY_PT,DICT_BASE.WORD_GAP,DICT_BASE.ROW_GAP,DICT_BASE.MIN_ROW_GAP);
  if(!best){
    for(const wg of [6.0,5.2,4.5]){
      best=tryFit(DICT_BASE.CELL,DICT_BASE.PY_H,DICT_BASE.PY_PT,wg,DICT_BASE.ROW_GAP,DICT_BASE.MIN_ROW_GAP);
      if(best)break;
    }
  }
  if(!best){
    for(let cm=16.5;cm>=4.0;cm=Math.round((cm-0.5)*10)/10){
      const sc=cm/DICT_BASE.CELL;
      const pyH=Math.max(2.6,Math.round(DICT_BASE.PY_H*sc*10)/10);
      const pyPt=Math.max(5.5,Math.round(DICT_BASE.PY_PT*sc*10)/10);
      const maxRg=Math.min(DICT_BASE.ROW_GAP,Math.max(1.2,Math.round(DICT_BASE.ROW_GAP*sc*10)/10));
      const minRg=Math.max(1.0,Math.round(DICT_BASE.MIN_ROW_GAP*sc*10)/10);
      const wgList=[Math.min(DICT_BASE.MIN_WORD_GAP,Math.max(2.0,Math.round(DICT_BASE.MIN_WORD_GAP*sc*10)/10))];
      if(cm>=12)wgList.unshift(DICT_BASE.MIN_WORD_GAP);
      for(const wg of wgList){
        best=tryFit(cm,pyH,pyPt,wg,maxRg,minRg);
        if(best)break;
      }
      if(best)break;
    }
  }
  if(!best){
    const packed=packDictChunks(prepared,4.0,1.5);
    const n=packed.length;
    const pyH=2.4,cellMm=4.0,rowH=pyH+cellMm;
    const rg=n>1?Math.max(0,Math.min(1.5,Math.floor(((availH-n*rowH)/(n-1))*10)/10)):0;
    best={cellMm,pyH,pyPt:5.0,wordGap:1.5,rowGap:rg,packed};
  }
  let y=PAGE.PAD_Y+PAGE.TOP_H+refH+refGap;
  const rowH=best.pyH+best.cellMm;
  const rows=best.packed.map((rowItems,rIdx)=>{
    const gapAfter=rIdx<best.packed.length-1?best.rowGap:0;
    const row={y,cellY:y+best.pyH,items:rowItems,gapAfter};
    y+=rowH+gapAfter;
    return row;
  });
  return {cellMm:best.cellMm,pyH:best.pyH,pyPt:best.pyPt,wordGap:best.wordGap,rowGap:best.rowGap,hasRef,refChars:refList,refH,refGap,rows,items};
}

function layoutSheet(items,per){
  const fillBlank=(per===4)||(items.length<per);
  let headH=8.5,stepGap=fillBlank?2.0:2.2,minBlockGap=fillBlank?3.5:1.6;
  const specs=items.map(c=>{
    const s=DB[c].s,n=s.length,cnt=n+1,wrapped=n>=PAGE.WRAP_MIN;
    const row1=wrapped?Math.ceil(cnt/2):cnt;
    const wMaxX=Math.min(wrapped?12:13,Math.floor(((PAGE.CONTENT_W+(row1-1)*PAGE.BORDER)/row1)*10)/10);
    return {c,s,n,cnt,wrapped,row1,wMaxX};
  });
  let wrapCap=fillBlank?11.0:(per===5?11.5:10.5);
  const measure=(hh,sg,bg,wc)=>{
    let sum=0;
    specs.forEach(sp=>{
      const w=sp.wrapped?Math.min(sp.wMaxX,wc):sp.wMaxX;
      const sh=sp.wrapped?(2*w-PAGE.BORDER):w;
      sum+=hh+sh+sg+PAGE.CELL;
    });
    return sum+Math.max(0,specs.length-1)*bg;
  };
  const wrappedSpecs=specs.filter(sp=>sp.wrapped);
  if(wrappedSpecs.length&&measure(headH,stepGap,minBlockGap,wrapCap)>PAGE.BODY_H){
    headH=8.0;stepGap=1.8;minBlockGap=fillBlank?2.5:1.2;
    const fixedH=specs.reduce((acc,sp)=>acc+headH+stepGap+PAGE.CELL+(sp.wrapped?0:sp.wMaxX),0)+Math.max(0,specs.length-1)*minBlockGap;
    const availPerWrap=(PAGE.BODY_H-fixedH)/wrappedSpecs.length;
    wrapCap=Math.max(7.5,Math.min(wrapCap,Math.floor(((availPerWrap+PAGE.BORDER)/2)*10)/10));
  }
  const blockHeights=specs.map(sp=>{
    const w=sp.wrapped?Math.min(sp.wMaxX,wrapCap):sp.wMaxX;
    const stepsH=sp.wrapped?(2*w-PAGE.BORDER):w;
    return {w,stepsH,h:headH+stepsH+stepGap+PAGE.CELL};
  });
  const totalContentH=blockHeights.reduce((a,b)=>a+b.h,0);
  let blockGap=minBlockGap;
  if(!fillBlank&&specs.length>1){
    const slack=(PAGE.BODY_H-totalContentH)/(specs.length-1);
    blockGap=Math.max(minBlockGap,Math.min(13.5,slack));
  }
  let y=PAGE.PAD_Y+PAGE.TOP_H;
  const blocks=specs.map((sp,idx)=>{
    const bh=blockHeights[idx];
    const gapAfter=idx<specs.length-1?blockGap:0;
    const blk={
      c:sp.c,s:sp.s,n:sp.n,wrapped:sp.wrapped,row1:sp.row1,
      w:bh.w,stepsH:bh.stepsH,headH,stepGap,y,
      stepsY:y+headH,
      pracY:y+headH+bh.stepsH+stepGap,
      h:bh.h,gapAfter
    };
    y+=bh.h+gapAfter;
    return blk;
  });
  const usedBodyH=y-(PAGE.PAD_Y+PAGE.TOP_H);
  const blankYs=[];
  let blankTopGap=0,blankRowGap=PAGE.BLANK_ROW_GAP;
  if(fillBlank){
    const rem=PAGE.BODY_H-usedBodyH;
    const desiredRows=Math.min(PAGE.MAX_BLANK_ROWS,Math.max(0,6-items.length));
    const maxFitRows=Math.floor((rem-PAGE.BLANK_TOP_MIN+PAGE.BLANK_ROW_MIN)/(PAGE.CELL+PAGE.BLANK_ROW_MIN));
    const rows=Math.min(desiredRows,Math.max(0,maxFitRows));
    if(rows>0){
      const needStd=PAGE.BLANK_TOP_GAP+rows*PAGE.CELL+(rows-1)*PAGE.BLANK_ROW_GAP;
      if(needStd<=rem){
        blankTopGap=PAGE.BLANK_TOP_GAP;
        blankRowGap=PAGE.BLANK_ROW_GAP;
      }else{
        const availGaps=rem-rows*PAGE.CELL;
        blankTopGap=Math.max(PAGE.BLANK_TOP_MIN,Math.min(PAGE.BLANK_TOP_GAP,Math.floor((availGaps/rows)*10)/10));
        blankRowGap=rows>1?Math.max(PAGE.BLANK_ROW_MIN,Math.min(PAGE.BLANK_ROW_GAP,Math.floor(((availGaps-blankTopGap)/(rows-1))*10)/10)):PAGE.BLANK_ROW_GAP;
      }
      let by=y+blankTopGap;
      for(let r=0;r<rows;r++){
        blankYs.push(by);
        by+=PAGE.CELL+blankRowGap;
      }
    }
  }
  return {blocks,blankYs,blankTopGap,blankRowGap};
}

function fit(){

  const sh=r.querySelector('.sheet');
  if(!sh){r.style.transform='';r.style.width='';r.style.marginLeft='';wrap.style.height='';return;}
  const viewW=document.documentElement.clientWidth||innerWidth;
  const sheetW=sh.offsetWidth||794;
  const s=Math.min(1,Math.max(0.2,(viewW-8)/sheetW));
  if(s>=0.999){
    r.style.transform='';r.style.width='';r.style.marginLeft='';wrap.style.height='';
  }else{
    r.style.width=sheetW+'px';
    r.style.transformOrigin='top left';
    r.style.transform='scale('+s.toFixed(4)+')';
    r.style.marginLeft=Math.max(0,(viewW-sheetW*s)/2).toFixed(1)+'px';
    wrap.style.height=Math.ceil(r.scrollHeight*s)+'px';
  }
}

function svgPathToPdf(d){
  const tok=String(d||'').match(/[MmLlHhVvQqCcZz]|-?(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?/g);
  if(!tok)return '';
  const out=[];
  let i=0,cmd='',cx=0,cy=0,sx=0,sy=0;
  const num=()=>parseFloat(tok[i++]);
  const isCmd=t=>/^[MmLlHhVvQqCcZz]$/.test(t);
  while(i<tok.length){
    if(isCmd(tok[i]))cmd=tok[i++];
    else if(!cmd)break;
    if(cmd==='M'||cmd==='m'){
      const rel=cmd==='m';
      const x=num()+(rel?cx:0),y=num()+(rel?cy:0);
      out.push(pNum(x)+' '+pNum(y)+' m');
      cx=sx=x;cy=sy=y;
      cmd=rel?'l':'L';
    }else if(cmd==='L'||cmd==='l'){
      const rel=cmd==='l';
      const x=num()+(rel?cx:0),y=num()+(rel?cy:0);
      out.push(pNum(x)+' '+pNum(y)+' l');
      cx=x;cy=y;
    }else if(cmd==='H'||cmd==='h'){
      const x=num()+(cmd==='h'?cx:0);
      out.push(pNum(x)+' '+pNum(cy)+' l');
      cx=x;
    }else if(cmd==='V'||cmd==='v'){
      const y=num()+(cmd==='v'?cy:0);
      out.push(pNum(cx)+' '+pNum(y)+' l');
      cy=y;
    }else if(cmd==='Q'||cmd==='q'){
      const rel=cmd==='q';
      const qx=num()+(rel?cx:0),qy=num()+(rel?cy:0);
      const x=num()+(rel?cx:0),y=num()+(rel?cy:0);
      const c1x=cx+(2/3)*(qx-cx),c1y=cy+(2/3)*(qy-cy);
      const c2x=x+(2/3)*(qx-x),c2y=y+(2/3)*(qy-y);
      out.push(pNum(c1x)+' '+pNum(c1y)+' '+pNum(c2x)+' '+pNum(c2y)+' '+pNum(x)+' '+pNum(y)+' c');
      cx=x;cy=y;
    }else if(cmd==='C'||cmd==='c'){
      const rel=cmd==='c';
      const x1=num()+(rel?cx:0),y1=num()+(rel?cy:0);
      const x2=num()+(rel?cx:0),y2=num()+(rel?cy:0);
      const x=num()+(rel?cx:0),y=num()+(rel?cy:0);
      out.push(pNum(x1)+' '+pNum(y1)+' '+pNum(x2)+' '+pNum(y2)+' '+pNum(x)+' '+pNum(y)+' c');
      cx=x;cy=y;
    }else if(cmd==='Z'||cmd==='z'){
      out.push('h');
      cx=sx;cy=sy;
      cmd='';
    }else{
      break;
    }
  }
  return out.join(' ');
}
function pdfCellOps(xMm,yMm,mm,strokePaths,upto,mode){
  const lw=PAGE.BORDER,inner=mm-2*lw;
  const ix=(xMm+lw)*PDF_PT,iy=(PAGE.H-(yMm+mm-lw))*PDF_PT,iw=inner*PDF_PT;
  const s=iw/1024,mx=ix+iw/2,my=iy+iw/2;
  const ops=[
    'q',
    pNum(ix)+' '+pNum(iy)+' '+pNum(iw)+' '+pNum(iw)+' re W n',
    '0.863 0.604 0.573 RG '+pNum(18*s)+' w ['+pNum(26*s)+' '+pNum(22*s)+'] 0 d',
    pNum(mx)+' '+pNum(iy+iw)+' m '+pNum(mx)+' '+pNum(iy)+' l S',
    pNum(ix)+' '+pNum(my)+' m '+pNum(ix+iw)+' '+pNum(my)+' l S'
  ];
  if(mode!=='none'&&strokePaths&&strokePaths.length){
    ops.push(pScale(s)+' 0 0 '+pScale(s)+' '+pNum(ix)+' '+pNum(iy+124*s)+' cm');
    if(mode==='full'||mode==='ghost'){
      ops.push(mode==='full'?'0.133 g':'0.839 g');
      for(let i=0;i<strokePaths.length;i++)if(strokePaths[i])ops.push(strokePaths[i]+' f');
    }else if(mode==='step'){
      if(upto>1){
        ops.push('0.784 g');
        const lim=Math.min(upto-1,strokePaths.length);
        for(let i=0;i<lim;i++)if(strokePaths[i])ops.push(strokePaths[i]+' f');
      }
      if(upto>=1&&upto<=strokePaths.length&&strokePaths[upto-1]){
        ops.push('0 g');
        ops.push(strokePaths[upto-1]+' f');
      }
    }
  }
  ops.push('Q');
  const bx=(xMm+lw/2)*PDF_PT,by=(PAGE.H-(yMm+mm-lw/2))*PDF_PT,bw=(mm-lw)*PDF_PT;
  ops.push(pNum(bx)+' '+pNum(by)+' '+pNum(bw)+' '+pNum(bw)+' re S');
  return ops.join('\n');
}
function pdfPlaceImg(name,xMm,yMm,wMm,hMm){
  const tx=xMm*PDF_PT,ty=(PAGE.H-(yMm+hMm))*PDF_PT;
  return 'q '+pNum(wMm*PDF_PT)+' 0 0 '+pNum(hMm*PDF_PT)+' '+pNum(tx)+' '+pNum(ty)+' cm /'+name+' Do Q';
}
function buildPageStream(lay,gh,strokeCache,headNames,topName){
  const ops=[];
  if(topName)ops.push(pdfPlaceImg(topName,PAGE.PAD_X,PAGE.PAD_Y,PAGE.CONTENT_W,PAGE.TOP_H));
  lay.blocks.forEach((b,idx)=>{
    const hn=headNames&&headNames[idx];
    if(hn)ops.push(pdfPlaceImg(hn,PAGE.PAD_X,b.y-HEAD_PAD_TOP,PAGE.CONTENT_W,b.headH+HEAD_PAD_TOP));
  });
  ops.push('0.267 G '+pNum(PAGE.BORDER*PDF_PT)+' w [] 0 d');
  const X0=PAGE.PAD_X,pracPitch=PAGE.CELL-PAGE.BORDER;
  lay.blocks.forEach(b=>{
    let sp=strokeCache.get(b.c);
    if(!sp){sp=b.s.map(svgPathToPdf);strokeCache.set(b.c,sp);}
    const stepPitch=b.w-PAGE.BORDER;
    ops.push(pdfCellOps(X0,b.stepsY,b.w,sp,0,'full'));
    for(let k=1;k<b.row1;k++)ops.push(pdfCellOps(X0+k*stepPitch,b.stepsY,b.w,sp,k,'step'));
    if(b.wrapped){
      const y2=b.stepsY+stepPitch;
      for(let k=b.row1;k<=b.n;k++)ops.push(pdfCellOps(X0+(k-b.row1)*stepPitch,y2,b.w,sp,k,'step'));
    }
    for(let k=0;k<PAGE.COLS;k++)ops.push(pdfCellOps(X0+k*pracPitch,b.pracY,PAGE.CELL,sp,0,k<gh?'ghost':'none'));
  });
  lay.blankYs.forEach(by=>{
    for(let k=0;k<PAGE.COLS;k++)ops.push(pdfCellOps(X0+k*pracPitch,by,PAGE.CELL,[],0,'none'));
  });
  return ops.join('\n');
}
function buildDictPageStream(pageLay,strokeCache,pyNames,topName,fallbackMap,refLblName){
  const ops=[];
  if(topName)ops.push(pdfPlaceImg(topName,PAGE.PAD_X,PAGE.PAD_Y,PAGE.CONTENT_W,PAGE.TOP_H));
  const getSp=c=>{
    let sp=strokeCache.get(c);
    if(!sp){sp=DB[c].s.map(svgPathToPdf);strokeCache.set(c,sp);}
    return sp;
  };
  if(pageLay.hasRef){
    const refX=PAGE.PAD_X,refY=PAGE.PAD_Y+PAGE.TOP_H;
    const m=refBarMetrics(pageLay.refChars.length);
    if(refLblName)ops.push(pdfPlaceImg(refLblName,refX+m.padX,refY+(pageLay.refH-6.0)/2,m.lblW,6.0));
    const refBw=0.25;
    ops.push('q 0.8 G '+pNum(refBw*PDF_PT)+' w [] 0 d '+pNum((refX+refBw/2)*PDF_PT)+' '+pNum((PAGE.H-(refY+pageLay.refH-refBw/2))*PDF_PT)+' '+pNum((PAGE.CONTENT_W-refBw)*PDF_PT)+' '+pNum((pageLay.refH-refBw)*PDF_PT)+' re S Q');
    const gxMm=refX+m.padX+m.lblW;
    const glyphYMm=refY+(pageLay.refH-m.glyphMm)/2;
    const iy=(PAGE.H-(glyphYMm+m.glyphMm))*PDF_PT;
    const s=(m.glyphMm*PDF_PT)/1024;
    pageLay.refChars.forEach((c,ci)=>{
      if(!DB||!DB[c])return;
      const ix=(gxMm+ci*(m.glyphMm+m.gapMm))*PDF_PT;
      const sp=getSp(c);
      ops.push('q '+pScale(s)+' 0 0 '+pScale(s)+' '+pNum(ix)+' '+pNum(iy+124*s)+' cm 0.133 g');
      for(let i=0;i<sp.length;i++)if(sp[i])ops.push(sp[i]+' f');
      ops.push('Q');
    });
  }
  pageLay.rows.forEach((r,idx)=>{
    const pn=pyNames&&pyNames[idx];
    if(pn)ops.push(pdfPlaceImg(pn,PAGE.PAD_X,r.y-HEAD_PAD_TOP,PAGE.CONTENT_W,pageLay.pyH+HEAD_PAD_TOP));
  });
  const X0=PAGE.PAD_X,cellMm=pageLay.cellMm,pitch=cellMm-PAGE.BORDER;
  const innerMm=cellMm-2*PAGE.BORDER;
  if(fallbackMap){
    pageLay.rows.forEach(r=>{
      r.items.forEach(it=>{
        it.chars.forEach((cObj,ci)=>{
          if(!cObj.isTarget&&!cObj.inDb&&fallbackMap[cObj.ch]){
            ops.push(pdfPlaceImg(fallbackMap[cObj.ch],X0+it.x+ci*pitch+PAGE.BORDER,r.cellY+PAGE.BORDER,innerMm,innerMm));
          }
        });
      });
    });
  }
  ops.push('0.267 G '+pNum(PAGE.BORDER*PDF_PT)+' w [] 0 d');
  pageLay.rows.forEach(r=>{
    r.items.forEach(it=>{
      it.chars.forEach((cObj,ci)=>{
        const cx=X0+it.x+ci*pitch;
        if(cObj.isTarget){
          ops.push(pdfCellOps(cx,r.cellY,cellMm,[],0,'none'));
        }else if(cObj.inDb){
          ops.push(pdfCellOps(cx,r.cellY,cellMm,getSp(cObj.ch),0,'ghost'));
        }else{
          ops.push(pdfCellOps(cx,r.cellY,cellMm,[],0,'none'));
        }
      });
    });
  });
  return ops.join('\n');
}
function measureHeadEntries(ctx,entries,pyBase,sc){
  let total=0;
  entries.forEach((e,idx)=>{
    ctx.font=stripPt(pyBase*sc)+'px Arial,"PingFang SC",sans-serif';
    total+=ctx.measureText(e.p).width;
    if(e.w.length){
      ctx.font=stripPt(13.5*sc)+'px '+KT_FONT;
      total+=1.8*sc*STRIP_MM+ctx.measureText(e.w.join(' ')).width;
    }
    if(idx<entries.length-1)total+=4.5*sc*STRIP_MM;
  });
  return total;
}
async function deflateBytes(u8){
  if(typeof CompressionStream==='undefined'){
    throw new Error('当前浏览器不支持原生 PDF 压缩，请换用 Safari 16.4+ / Chrome / Edge');
  }
  const ab=await new Response(new Blob([u8]).stream().pipeThrough(new CompressionStream('deflate'))).arrayBuffer();
  return new Uint8Array(ab);
}
async function canvasToFlateImage(cv,gray){
  const w=cv.width,h=cv.height;
  const rgba=cv.getContext('2d',{willReadFrequently:true}).getImageData(0,0,w,h).data;
  const raw=new Uint8Array(w*h*(gray?1:3));
  if(gray){
    for(let i=0,j=0;i<rgba.length;i+=4,j++)raw[j]=Math.round(0.299*rgba[i]+0.587*rgba[i+1]+0.114*rgba[i+2]);
  }else{
    for(let i=0,j=0;i<rgba.length;i+=4,j+=3){raw[j]=rgba[i];raw[j+1]=rgba[i+1];raw[j+2]=rgba[i+2];}
  }
  return {w,h,gray:Boolean(gray),data:await deflateBytes(raw)};
}
async function renderTopStrip(cv,dt,title){
  const w=Math.max(1,Math.round(PAGE.CONTENT_W*STRIP_MM));
  const h=Math.max(1,Math.round(PAGE.TOP_H*STRIP_MM));
  cv.width=w;cv.height=h;
  const ctx=cv.getContext('2d',{willReadFrequently:true});
  ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
  const y=(15.5-PAGE.PAD_Y)*STRIP_MM,ly=y+0.8*STRIP_MM;
  ctx.fillStyle='#555';ctx.strokeStyle='#555';ctx.lineWidth=.3*STRIP_MM;ctx.setLineDash([]);
  ctx.font=stripPt(11)+'px '+KT_FONT;ctx.textBaseline='alphabetic';ctx.textAlign='left';
  ctx.fillText(title||'汉字笔顺练习',0,y);
  const segs=dt.blank
    ?[{t:'姓名：'},{l:22},{t:'　日期：'},{l:11},{t:'年'},{l:6.5},{t:'月'},{l:6.5},{t:'日（'},{l:5.5},{t:'）'}]
    :[{t:'姓名：'},{l:22},{t:'　日期：'},{ul:dt.label,pad:1.2}];
  const segW=s=>s.t?ctx.measureText(s.t).width:(s.l?s.l*STRIP_MM:(ctx.measureText(s.ul).width+2*s.pad*STRIP_MM));
  let x=w-segs.reduce((a,s)=>a+segW(s),0);
  segs.forEach(s=>{
    const sw=segW(s);
    if(s.t){ctx.fillText(s.t,x,y);}
    else if(s.l){ctx.beginPath();ctx.moveTo(x,ly);ctx.lineTo(x+sw,ly);ctx.stroke();}
    else if(s.ul){
      ctx.fillText(s.ul,x+s.pad*STRIP_MM,y);
      ctx.beginPath();ctx.moveTo(x,ly);ctx.lineTo(x+sw,ly);ctx.stroke();
    }
    x+=sw;
  });
  return canvasToFlateImage(cv,true);
}

async function renderHeadStrip(cv,c,n,headH){
  const w=Math.max(1,Math.round(PAGE.CONTENT_W*STRIP_MM));
  const h=Math.max(1,Math.round((headH+HEAD_PAD_TOP)*STRIP_MM));
  cv.width=w;cv.height=h;
  const ctx=cv.getContext('2d',{willReadFrequently:true});
  ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
  const y=(HEAD_PAD_TOP+headH-2.2)*STRIP_MM;
  const meta=c+' · '+n+' 画';
  ctx.textBaseline='alphabetic';
  ctx.fillStyle='#888';ctx.font=stripPt(9)+'px '+KT_FONT;ctx.textAlign='right';
  const metaW=ctx.measureText(meta).width;
  ctx.fillText(meta,w,y);
  ctx.textAlign='left';
  const entries=activeEntries(c);

    const multi=isPoly(c)||entries.some(e=>e.w.length>0);

        ctx.fillText(ws,x,y);

      }

async function renderDictPinyinStrip(cv,row,pageLay){
  const w=Math.max(1,Math.round(PAGE.CONTENT_W*STRIP_MM));

  const cellMm=pageLay.cellMm,pitch=cellMm-PAGE.BORDER;
  const padBot=Math.max(0.7,1.2*(cellMm/17));
  const y=(HEAD_PAD_TOP+pageLay.pyH-padBot)*STRIP_MM;
  const maxW=Math.max(2,(cellMm-0.8))*STRIP_MM;
  const baseFs=stripPt(pageLay.pyPt);

function makePdf(pages,sharedImages){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=b=>{const u=typeof b==='string'?enc.encode(b):b;parts.push(u);len+=u.length;};
  const obj=(n,body)=>{offs[n]=len;push(n+' 0 obj\n'+body+'\nendobj\n');};
  const streamObj=(n,dict,data)=>{
    offs[n]=len;
    push(n+' 0 obj\n'+dict+'\nstream\n');
    push(data);
    push('\nendstream\nendobj\n');
  };
  const imgObj=(n,im)=>{
    const cs=im.gray?'/DeviceGray':'/DeviceRGB';
    streamObj(n,'<</Type/XObject/Subtype/Image/Width '+im.w+'/Height '+im.h+'/ColorSpace'+cs+'/BitsPerComponent 8/Filter/FlateDecode/Length '+im.data.length+'>>',im.data);
  };
  let nextId=3;
  const sharedList=Object.entries(sharedImages||{}).map(([name,im])=>({name,im,id:nextId++}));
  const pagePlans=pages.map(pg=>{
    const pageId=nextId++;
    const imgs=Object.entries(pg.images||{}).map(([name,im])=>({name,im,id:nextId++}));
    const contentId=nextId++;
    return {pageId,imgs,contentId,stream:pg.stream};
  });
  push('%PDF-1.4\n');
  push(new Uint8Array([0x25,0xe2,0xe3,0xcf,0xd3,0x0a]));
  obj(1,'<</Type/Catalog/Pages 2 0 R>>');
  obj(2,'<</Type/Pages/Kids['+pagePlans.map(p=>p.pageId+' 0 R').join(' ')+']/Count '+pagePlans.length+'>>');
  sharedList.forEach(s=>imgObj(s.id,s.im));
  pagePlans.forEach(p=>{
    const xobjs=[...sharedList,...p.imgs].map(x=>'/'+x.name+' '+x.id+' 0 R').join(' ');
    const res=xobjs?'<</XObject<<'+xobjs+'>>>>':'<<>>';
    obj(p.pageId,'<</Type/Page/Parent 2 0 R/MediaBox[0 0 595.28 841.89]/Resources'+res+'/Contents '+p.contentId+' 0 R>>');
    p.imgs.forEach(x=>imgObj(x.id,x.im));
    streamObj(p.contentId,'<</Filter/FlateDecode/Length '+p.stream.length+'>>',p.stream);
  });
  const xr=len,total=nextId;
  push('xref\n0 '+total+'\n0000000000 65535 f \n');
  for(let n=1;n<total;n++)push(String(offs[n]).padStart(10,'0')+' 00000 n \n');
  push('trailer\n<</Size '+total+'/Root 1 0 R>>\nstartxref\n'+xr+'\n%%EOF\n');
  return new Blob(parts,{type:'application/pdf'});
}

async function exportPdf(){
  flushInput();
  const {ok,per,gh}=cur();if(!ok.length){$('msg').textContent='请先输入生字';return;}
  const mode=curMode();
  if(mode==='dictation'&&!ok.some(c=>activeEntries(c).length>0)){$('msg').textContent='请至少勾选一个需要默写的读音';return;}
  busy(true);$('msg').textContent='正在生成 PDF…';
  const cv=document.createElement('canvas');
  try{
    const dt=selectedDateInfo();
    const showRef=isShowRef();
    const sharedImages={};
    if(mode==='stroke'||mode==='duplex')sharedImages.Top=await renderTopStrip(cv,dt,'汉字笔顺练习');
    if(mode==='duplex'||mode==='dictation'){
      sharedImages.TopBack=await renderTopStrip(cv,dt,'生字默写练习');
      if(showRef)sharedImages.RefLbl=await renderRefLabelStrip(cv);
    }
    const enc=new TextEncoder();
    const strokeCache=new Map();
    const pages=[];
    const plans=buildPagePlan(ok,per);
    const totalPdfPages=plans.length*(mode==='duplex'?2:1);
    let donePages=0;
    for(let i=0;i<plans.length;i++){
      const pl=plans[i];
      if(mode==='stroke'||mode==='duplex'){
        donePages++;
        if(totalPdfPages>1)$('msg').textContent='正在生成 PDF（'+donePages+'/'+totalPdfPages+'）…';
        const lay=layoutSheet(pl.pageChars,per);
        const images={},headNames=[];
        for(let j=0;j<lay.blocks.length;j++){
          const b=lay.blocks[j];
          const hn='H'+j;
          headNames.push(hn);
          images[hn]=await renderHeadStrip(cv,b.c,b.n,b.headH);
        }
        const rawStream=buildPageStream(lay,gh,strokeCache,headNames,'Top');
        const stream=await deflateBytes(enc.encode(rawStream));
        pages.push({stream,images});
        await new Promise(r=>setTimeout(r,0));
      }
      if(mode==='duplex'||mode==='dictation'){
        donePages++;
        if(totalPdfPages>1)$('msg').textContent='正在生成 PDF（'+donePages+'/'+totalPdfPages+'）…';
        const dLay=layoutDictPage(pl.dictItems,showRef?pl.refChars:[]);
        const images={},pyNames=[],fallbackMap={};
        let fbIdx=0;
        for(let rIdx=0;rIdx<dLay.rows.length;rIdx++){
          const r=dLay.rows[rIdx];
          const pn='P'+rIdx;
          pyNames.push(pn);
          images[pn]=await renderDictPinyinStrip(cv,r,dLay);
          for(const it of r.items){
            for(const cObj of it.chars){
              if(!cObj.isTarget&&!cObj.inDb&&!fallbackMap[cObj.ch]){
                const fn='F'+(fbIdx++);
                fallbackMap[cObj.ch]=fn;
                images[fn]=await renderFallbackCharImg(cv,cObj.ch,dLay.cellMm);
              }
            }
          }
        }
        const rawStream=buildDictPageStream(dLay,strokeCache,pyNames,'TopBack',fallbackMap,showRef?'RefLbl':null);
        const stream=await deflateBytes(enc.encode(rawStream));
        pages.push({stream,images});
        await new Promise(r=>setTimeout(r,0));
      }
    }
    $('msg').textContent='';
    await saveFile(MODE_META[mode].filePrefix+'_'+today()+'.pdf',makePdf(pages,sharedImages));
  }catch(e){$('msg').textContent='生成失败：'+(e.message||e);}
  finally{cv.width=0;cv.height=0;busy(false);}
}

  let m='# 生字练习表\n\n生字：'+ok.map(c=>{
    const pys=activeEntries(c).map(e=>e.p).join(' / ');
    return c+(pys?'（'+pys+'）':'');
  }).join('、')+'\n\n| 序号 | 汉字 | 拼音 | 例词 | 笔画数 |\n| --- | --- | --- | --- | --- |\n';
  ok.forEach((c,i)=>{
    const entries=activeEntries(c);
    const pyCol=escMd(entries.map(e=>e.p).join(' / '));
    const showPrefix=isPoly(c)&&entries.length>1;
    const wdCol=escMd(entries.filter(e=>e.w.length).map(e=>(showPrefix?e.p+'：':'')+e.w.join('、')).join('；'));
    m+='| '+(i+1)+' | '+c+' | '+pyCol+' | '+wdCol+' | '+DB[c].s.length+' |\n';
  });
  if(mode==='duplex'){
    const plans=buildPagePlan(ok,per);
    m+='\n## 反面默写练习\n\n'+buildDictPagesMd(plans);
  }
  m+='\n生成日期：'+dtLabel+'\n';
  return m;
}
async function exportMd(){
  flushInput();
  const {ok}=cur();if(!ok.length){$('msg').textContent='请先输入生字';return;}
  if(curMode()==='dictation'&&!ok.some(c=>activeEntries(c).length>0)){$('msg').textContent='请至少勾选一个需要默写的读音';return;}
  await saveFile(MODE_META[curMode()].filePrefix+'_'+today()+'.md',new Blob([buildMd()],{type:'text/markdown'}));
}
addEventListener('resize',()=>{if(curMode()!=='dictation')fitHeads();fit();});
addEventListener('orientationchange',()=>setTimeout(()=>{if(curMode()!=='dictation')fitHeads();fit();},120));
addEventListener('afterprint',fit);
$('root').addEventListener('click',e=>{
  const el=e.target.closest('.poly-py');
  if(!el)return;
  const ci=Number(el.dataset.ci);
  if(el.dataset.target&&el.dataset.word&&Number.isInteger(ci)){
    cyclePartnerPy(el.dataset.target,el.dataset.tpy||'',el.dataset.word,ci);
  }
});
$('root').addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ')return;
  const el=e.target.closest('.poly-py');
  if(!el)return;
  e.preventDefault();
  const ci=Number(el.dataset.ci);
  if(el.dataset.target&&el.dataset.word&&Number.isInteger(ci)){
    cyclePartnerPy(el.dataset.target,el.dataset.tpy||'',el.dataset.word,ci);
  }
});
$('inp').oninput=()=>{if(inpTimer)clearTimeout(inpTimer);inpTimer=setTimeout(()=>{inpTimer=null;syncFromInput();},150);};
$('mode').onchange=()=>{
  $('msg').textContent='';
  syncModeUi();
  try{localStorage.setItem(MODE_KEY,curMode());}catch(e){}
  buildPoly();
  render();
};
$('per').onchange=render;$('ghost').onchange=render;
$('showRef').onchange=()=>{
  try{localStorage.setItem(REF_KEY,$('showRef').checked?'1':'0');}catch(e){}
  render();
};
$('dt').onchange=()=>{
  if(!$('dt').value){$('dtAuto').checked=false;syncDateUi();}
  render();
};
$('dtAuto').onchange=()=>{
  if($('dtAuto').checked&&!$('dt').value)$('dt').value=localDateParts().ymd;
  syncDateUi();
  render();
};
setTimeout(()=>{if(!DB&&!$('msg').textContent.includes('失败'))$('msg').textContent='字库 20 秒还没加载出来：请刷新重试，或换 Safari / Chrome 打开链接。';},20000);
(async()=>{
  try{
    const bin=Uint8Array.from(atob(B64),c=>c.charCodeAt(0));
    DB=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).json();
  }catch(e){$('msg').textContent='字库加载失败，请换用较新的浏览器（Safari 16.4+ / Chrome）。';return;}
