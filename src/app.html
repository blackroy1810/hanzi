<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>汉字笔顺练习纸生成器</title>
<style>
:root{--bg:#e9e9ec;--panel:#fff;--card:#f5f5f7;--ink:#222;--muted:#666;--line:#d0d0d6;--accent:#c0392b;--accent-bg:#fdeceb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#232327;--panel:#34343a;--card:#2a2a30;--ink:#eee;--muted:#aaa;--line:#55555d;--accent:#e05a4d;--accent-bg:#472927}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.ui{background:var(--panel);padding:12px 14px;border-bottom:1px solid var(--line)}
.ui h1{font-size:17px;margin:0 0 8px}
textarea{width:100%;box-sizing:border-box;font-size:20px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-family:inherit;resize:vertical}
.opts{display:flex;flex-wrap:wrap;gap:10px 16px;margin:8px 0;font-size:14px;align-items:center}
select,input[type=text],input[type=date]{font-size:14px;padding:4px 7px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.dt-grp{display:inline-flex;align-items:center;gap:6px}
.dt-blank{display:inline-flex;align-items:center;gap:4px;cursor:pointer;user-select:none}
.dt-blank input{margin:0;accent-color:var(--accent)}
button.alt{background:#555}button:disabled{opacity:.5}button{font-size:15px;padding:8px 18px;border:0;border-radius:8px;background:#c0392b;color:#fff;cursor:pointer}
button.mini{font-size:12px;padding:3px 8px;border-radius:6px;background:#666;color:#fff;line-height:1.4}
button.mini.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
#poly{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.pcard-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.pchar{font-size:20px;font-weight:700;min-width:24px}
.ptag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:14px;cursor:pointer;user-select:none}
.ptag input{margin:0;accent-color:var(--accent)}
.ptag.on{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);font-weight:600}
.ptag .px,.wchip .wx{background:none;border:0;color:inherit;opacity:.65;padding:0 2px;font-size:14px;line-height:1;cursor:pointer}
.ptag .px:hover,.wchip .wx:hover{opacity:1}
.padd-py{display:inline-flex;align-items:center;gap:4px;margin-left:auto}
.padd-py input{width:76px;font-size:13px;padding:3px 6px}
.pw-list{display:flex;flex-direction:column;gap:6px;margin-top:7px;padding-top:7px;border-top:1px dashed var(--line)}
.pw-row{display:flex;flex-wrap:wrap;align-items:center;gap:5px 6px;font-size:13px}
.pw-py{font-weight:600;color:var(--accent);min-width:44px;font-family:Arial,"PingFang SC",sans-serif}
.pw-py.py-edit{cursor:pointer;border-bottom:1px dashed currentColor;min-width:0;padding:0 2px}
.py-inp{width:64px;font-size:13px;padding:1px 5px}
.srow .px{background:none;border:0;color:var(--muted);padding:0 2px;font-size:13px;line-height:1;cursor:pointer}
.srow .px:hover{color:var(--accent)}
.wchip{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:6px;background:var(--panel);border:1px solid var(--line);font-size:14px}
.wempty{font-size:12px;color:var(--muted)}
.wadd{width:84px;font-size:13px;padding:2px 6px}
.sbox{margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.sbox summary{font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.slist{display:flex;flex-direction:column;gap:6px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.srow{display:flex;flex-wrap:wrap;align-items:center;gap:5px 6px;font-size:13px}
.srow .pchar{font-size:18px;min-width:20px}
#msg{font-size:13px;color:#c0392b;margin-top:6px;min-height:1em}
.tip{font-size:12px;opacity:.7;margin-top:4px}
.wrap{padding:12px 0;overflow:hidden}
.sheet{background:#fff;color:#222;width:210mm;height:297mm;margin:0 auto 12px;padding:10mm 13.25mm;box-sizing:border-box;page-break-after:always;overflow:hidden;font-family:"Kaiti SC","KaiTi","PingFang SC",sans-serif}
.top{height:8mm;font-size:11pt;display:flex;justify-content:space-between;align-items:baseline;color:#555}
.top-r{display:inline-flex;align-items:baseline;white-space:nowrap}
.u{display:inline-block;border-bottom:.3mm solid #555;padding:0 .6mm .35mm;line-height:1.1;text-align:center;box-sizing:border-box}
.u.dt-val{padding:0 1.2mm .35mm}
.head{height:8.5mm;display:flex;align-items:baseline;justify-content:space-between;gap:4mm}
.py-line{--sc:1;--py-pt:17pt;flex:1;min-width:0;overflow:hidden;white-space:nowrap}
.py-line.multi{--py-pt:15.5pt}
.py-in{display:inline-flex;align-items:baseline;white-space:nowrap}
.py-item{display:inline-flex;align-items:baseline;margin-right:calc(4.5mm * var(--sc))}
.py-item:last-child{margin-right:0}
.py{font-family:Arial,"PingFang SC",sans-serif;font-size:calc(var(--py-pt) * var(--sc));color:#c0392b}
.wd{font-size:calc(13.5pt * var(--sc));color:#333;margin-left:calc(1.8mm * var(--sc))}
.meta{font-size:9pt;color:#888;flex:none;white-space:nowrap}
.row{display:flex}
.row.steps-r2{margin-top:-.35mm}
.row.blank-row:last-child{margin-bottom:0!important}
.cell{box-sizing:border-box;border:.35mm solid #444;flex:none;margin-right:-.35mm}
svg{display:block}
@media (pointer:coarse){select,input[type=text],input[type=date],.padd-py input,.wadd,.py-inp{font-size:16px}}
@page{size:A4;margin:0}
@media print{body{background:#fff}.ui{display:none}.wrap{padding:0;overflow:visible;height:auto!important}#root{transform:none!important;width:auto!important;margin-left:0!important}.sheet{margin:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}.sheet:last-child{page-break-after:auto;break-after:auto}}
</style></head><body>
<div class="ui">
<h1>汉字笔顺练习纸</h1>
<textarea id="inp" rows="2" placeholder="输入生字，例如：树桥数欢园"></textarea>
<div class="opts">
<label>每页字数 <select id="per"><option>4</option><option>5</option><option selected>6</option></select></label>
<label>描红格 <select id="ghost"><option>0</option><option>2</option><option selected>3</option><option>4</option></select></label>
<span class="dt-grp"><label>日期 <input type="date" id="dt"></label><label class="dt-blank"><input type="checkbox" id="dtBlank"> 手填</label></span>
<button id="bprint" onclick="doPrint()">一键打印</button><button id="bpdf" class="alt" onclick="exportPdf()">导出 PDF</button><button id="bmd" class="alt" onclick="exportMd()">导出 Markdown</button>
</div>
<div id="poly"></div>
<div id="singles"></div>
<div id="msg">字库加载中…如果一直没变化，说明当前打开方式不能运行网页，请改用 Safari 或 Chrome 打开页面链接（不要用文件预览或微信内置浏览器）。</div>
<div class="tip">收录常用字约 7000 个。多音字可勾选读音、添加自定义拼音，所有汉字均支持自由增删组词（自动保存在本机）。点击“一键打印”或导出 PDF 后请选 A4 纸、缩放选“实际大小”。</div>
</div>
<div class="wrap"><div id="root"></div></div>
<script>
const B64="__DB__";
const $=id=>document.getElementById(id);
let DB=null;
let cfg={};
let singlesOpen=null;
let lastCharKey='';
let inpTimer=null;
const CFG_KEY='hz_poly_v1';
const L='stroke="#dc9a92" stroke-width="18" stroke-dasharray="26 22"';
const grid='<line x1="512" y1="0" x2="512" y2="1024" '+L+'/><line x1="0" y1="512" x2="1024" y2="512" '+L+'/>';
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function loadCfg(){
  try{const raw=localStorage.getItem(CFG_KEY);if(raw){const p=JSON.parse(raw);if(p&&typeof p==='object')cfg=p;}}catch(e){}
}
function saveCfg(){try{localStorage.setItem(CFG_KEY,JSON.stringify(cfg));}catch(e){}}
function ensureCfg(c){
  if(!cfg[c])cfg[c]={on:{},w:{},cp:[]};
  if(!cfg[c].on)cfg[c].on={};
  if(!cfg[c].w)cfg[c].w={};
  if(!Array.isArray(cfg[c].cp))cfg[c].cp=[];
  return cfg[c];
}
function allPys(c){
  const base=(DB&&DB[c])?DB[c].p:[];
  const extra=(cfg[c]&&Array.isArray(cfg[c].cp))?cfg[c].cp:[];
  return [...new Set([...base,...extra])];
}
function isCustomPy(c,p){return Boolean(DB&&DB[c]&&!DB[c].p.includes(p)&&cfg[c]&&Array.isArray(cfg[c].cp)&&cfg[c].cp.includes(p));}
function defWords(c,p){return (DB&&DB[c]&&DB[c].w&&Array.isArray(DB[c].w[p]))?DB[c].w[p]:[];}
function isDefOn(c,p){
  if(isCustomPy(c,p))return true;
  if(DB&&DB[c]&&DB[c].w)return defWords(c,p).length>0;
  return Boolean(DB&&DB[c]&&p===DB[c].p[0]);
}
function isOn(c,p){
  if(cfg[c]&&cfg[c].on&&Object.prototype.hasOwnProperty.call(cfg[c].on,p))return Boolean(cfg[c].on[p]);
  return isDefOn(c,p);
}
function wordsOf(c,p){
  if(cfg[c]&&cfg[c].w&&Object.prototype.hasOwnProperty.call(cfg[c].w,p))return cfg[c].w[p];
  return defWords(c,p);
}
function hasWordOverride(c,p){
  if(!(cfg[c]&&cfg[c].w&&Object.prototype.hasOwnProperty.call(cfg[c].w,p)))return false;
  const a=cfg[c].w[p],b=defWords(c,p);
  return a.length!==b.length||a.some((x,i)=>x!==b[i]);
}
function isPoly(c){return Boolean(DB&&DB[c]&&(DB[c].p.length>1||(cfg[c]&&cfg[c].cp&&cfg[c].cp.length>0)));}
function singlePy(c){
  if(cfg[c]&&typeof cfg[c].sp==='string'&&cfg[c].sp.trim())return cfg[c].sp.trim();
  return (DB&&DB[c])?DB[c].p[0]:'';
}
function hasSinglePyOverride(c){return Boolean(cfg[c]&&typeof cfg[c].sp==='string'&&cfg[c].sp.trim()&&DB&&DB[c]&&cfg[c].sp.trim()!==DB[c].p[0]);}
function activeEntries(c){
  if(!DB||!DB[c])return [];
  if(!isPoly(c))return [{p:singlePy(c),w:wordsOf(c,DB[c].p[0])}];
  return allPys(c).filter(p=>isOn(c,p)).map(p=>({p,w:wordsOf(c,p)}));
}
function setSinglePy(c,raw){
  const py=String(raw||'').trim();
  const st=ensureCfg(c);
  if(!py||(DB&&DB[c]&&py===DB[c].p[0]))delete st.sp;
  else st.sp=py;
  saveCfg();updateCharUi(c);render();
}
function togglePy(c,p,val){
  const next=typeof val==='boolean'?val:!isOn(c,p);
  if(!next&&isOn(c,p)){
    const onCount=allPys(c).filter(x=>isOn(c,x)).length;
    if(onCount<=1){
      updateCharUi(c,{type:'pycb',py:p});
      $('msg').textContent='「'+c+'」至少保留一个读音';
      return;
    }
  }
  const st=ensureCfg(c);
  st.on[p]=next;
  saveCfg();updateCharUi(c,{type:'pycb',py:p});render();
}
function addWords(c,p,raw){
  const parts=String(raw||'').split(/[\s,，、;；]+/).map(x=>x.trim()).filter(Boolean);
  if(!parts.length)return;
  const st=ensureCfg(c);
  const cur=[...wordsOf(c,p)];
  parts.forEach(w=>{if(!cur.includes(w))cur.push(w);});
  st.w[p]=cur;
  saveCfg();updateCharUi(c,{type:'wadd',py:p});render();
}
function delWord(c,p,word){
  const st=ensureCfg(c);
  st.w[p]=wordsOf(c,p).filter(w=>w!==word);
  saveCfg();updateCharUi(c,{type:'wadd',py:p});render();
}
function resetWords(c,p){
  if(cfg[c]&&cfg[c].w)delete cfg[c].w[p];
  saveCfg();updateCharUi(c,{type:'wadd',py:p});render();
}
function addCustomPy(c,raw){
  const py=String(raw||'').trim();
  if(!py)return;
  const wasPoly=isPoly(c);
  const st=ensureCfg(c);
  if(!DB[c].p.includes(py)&&!st.cp.includes(py)){
    st.cp.push(py);
    if(!Object.prototype.hasOwnProperty.call(st.w,py))st.w[py]=[];
  }
  st.on[py]=true;
  saveCfg();
  if(wasPoly)updateCharUi(c,{type:'addpy'});else buildPoly();
  render();
}
function delCustomPy(c,py){
  if(!cfg[c])return;
  if(Array.isArray(cfg[c].cp))cfg[c].cp=cfg[c].cp.filter(x=>x!==py);
  if(cfg[c].on)delete cfg[c].on[py];
  if(cfg[c].w)delete cfg[c].w[py];
  if(isPoly(c)&&!allPys(c).some(x=>isOn(c,x))&&DB&&DB[c]){
    ensureCfg(c).on[DB[c].p[0]]=true;
  }
  saveCfg();
  if(isPoly(c))updateCharUi(c);else buildPoly();
  render();
}
function cell(s,upto,mode,mm){
  let g='';
  s.forEach((p,i)=>{let f=null;
    if(mode==='full')f='#222';
    else if(mode==='ghost')f='#d6d6d6';
    else if(mode==='step'){f=i<upto-1?'#c8c8c8':(i===upto-1?'#000':null);}
    if(f)g+='<path d="'+p+'" fill="'+f+'"/>';});
  return '<div class="cell" style="width:'+mm+'mm;height:'+mm+'mm"><svg viewBox="0 0 1024 1024" width="100%" height="100%">'+grid+'<g transform="translate(0,900) scale(1,-1)">'+g+'</g></svg></div>';
}
function chars(){const t=$('inp').value.match(/[\u4e00-\u9fff]/g)||[];return [...new Set(t)];}
function buildWordRow(c,p,showChar){
  const row=document.createElement('div');row.className=showChar?'srow':'pw-row';row.dataset.char=c;row.dataset.py=p;
  if(showChar){
    const ch=document.createElement('span');ch.className='pchar';ch.textContent=c;
    row.appendChild(ch);
  }
  const pyLab=document.createElement('span');
  if(showChar){
    const curPy=singlePy(c);
    pyLab.className='pw-py py-edit';pyLab.textContent=curPy;pyLab.title='点击修改读音';
    pyLab.onclick=()=>{
      const pi=document.createElement('input');pi.type='text';pi.className='py-inp';pi.value=curPy;pi.setAttribute('aria-label',c+' 自定义拼音');
      let done=false;
      const commit=()=>{if(done)return;done=true;setSinglePy(c,pi.value);};
      pi.onblur=commit;
      pi.onkeydown=e=>{
        if(e.key==='Enter'){e.preventDefault();commit();}
        else if(e.key==='Escape'){done=true;pi.replaceWith(pyLab);}
      };
      pyLab.replaceWith(pi);pi.focus();pi.select();
    };
    row.appendChild(pyLab);
    if(hasSinglePyOverride(c)){
      const rx=document.createElement('button');rx.type='button';rx.className='px';rx.textContent='×';rx.title='恢复默认读音';
      rx.onclick=()=>setSinglePy(c,'');
      row.appendChild(rx);
    }
  }else{
    pyLab.className='pw-py';pyLab.textContent=p;
    row.appendChild(pyLab);
  }
  const curWords=wordsOf(c,p);
  if(curWords.length){
    curWords.forEach(w=>{
      const ch=document.createElement('span');ch.className='wchip';
      const wt=document.createElement('span');wt.textContent=w;
      const wb=document.createElement('button');wb.type='button';wb.className='wx';wb.textContent='×';wb.title='删除组词';
      wb.onclick=()=>delWord(c,p,w);
      ch.append(wt,wb);row.appendChild(ch);
    });
  }else{
    const em=document.createElement('span');em.className='wempty';em.textContent='暂无推荐组词，可手动添加';
    row.appendChild(em);
  }
  const wi=document.createElement('input');wi.type='text';wi.className='wadd';wi.placeholder='添加组词';wi.setAttribute('aria-label',c+' '+p+' 添加组词');
  const wab=document.createElement('button');wab.type='button';wab.className='mini';wab.textContent='+';
  const doAddW=()=>{const v=wi.value.trim();if(v)addWords(c,p,v);};
  wab.onclick=doAddW;
  wi.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();doAddW();}};
  row.append(wi,wab);
  if(defWords(c,p).length&&hasWordOverride(c,p)){
    const rb=document.createElement('button');rb.type='button';rb.className='mini ghost';rb.textContent='恢复推荐';
    rb.onclick=()=>resetWords(c,p);
    row.appendChild(rb);
  }
  return row;
}
function buildPolyCard(c){
  const card=document.createElement('div');card.className='pcard';card.dataset.char=c;
  const top=document.createElement('div');top.className='pcard-top';
  const b=document.createElement('span');b.className='pchar';b.textContent=c;
  top.appendChild(b);
  const pys=allPys(c);
  pys.forEach(p=>{
    const on=isOn(c,p);
    const lb=document.createElement('label');lb.className='ptag'+(on?' on':'');lb.dataset.py=p;
    const cb=document.createElement('input');cb.type='checkbox';cb.checked=on;
    cb.onchange=()=>togglePy(c,p,cb.checked);
    const tx=document.createElement('span');tx.textContent=p;
    lb.append(cb,tx);
    if(isCustomPy(c,p)){
      const dx=document.createElement('button');dx.type='button';dx.className='px';dx.textContent='×';dx.title='删除自定义拼音';
      dx.onclick=e=>{e.preventDefault();e.stopPropagation();delCustomPy(c,p);};
      lb.appendChild(dx);
    }
    top.appendChild(lb);
  });
  const addPyBox=document.createElement('span');addPyBox.className='padd-py';
  const pi=document.createElement('input');pi.type='text';pi.placeholder='自定义拼音';pi.setAttribute('aria-label',c+' 自定义拼音');
  const pb=document.createElement('button');pb.type='button';pb.className='mini';pb.textContent='+ 拼音';
  const doAddPy=()=>{const v=pi.value.trim();if(v)addCustomPy(c,v);};
  pb.onclick=doAddPy;
  pi.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();doAddPy();}};
  addPyBox.append(pi,pb);
  top.appendChild(addPyBox);
  card.appendChild(top);

  const onPys=pys.filter(p=>isOn(c,p));
  if(onPys.length){
    const wl=document.createElement('div');wl.className='pw-list';
    onPys.forEach(p=>wl.appendChild(buildWordRow(c,p,false)));
    card.appendChild(wl);
  }
  return card;
}
function updateSinglesSummary(){
  const det=$('singles').querySelector('details');
  if(!det||!DB)return;
  const singles=chars().filter(c=>DB[c]&&!isPoly(c));
  const missingCount=singles.filter(c=>wordsOf(c,DB[c].p[0]).length===0).length;
  const sum=det.querySelector('summary');
  if(sum){
    sum.textContent=missingCount>0
      ?('普通汉字组词设置（'+singles.length+' 字，其中 '+missingCount+' 字暂无推荐组词；点击拼音可改音）')
      :('普通汉字组词设置（'+singles.length+' 字，点击展开增删组词或改音）');
  }
}
function updateCharUi(c,focus){
  if(!DB||!DB[c])return;
  if(isPoly(c)){
    const old=[...$('poly').children].find(el=>el.dataset.char===c);
    if(!old){buildPoly();return;}
    const card=buildPolyCard(c);
    old.replaceWith(card);
    if(focus){
      let target=null;
      if(focus.type==='wadd')target=[...card.querySelectorAll('.pw-row')].find(r=>r.dataset.py===focus.py)?.querySelector('.wadd');
      else if(focus.type==='addpy')target=card.querySelector('.padd-py input');
      else if(focus.type==='pycb')target=[...card.querySelectorAll('.ptag')].find(t=>t.dataset.py===focus.py)?.querySelector('input');
      if(target)target.focus();
    }
  }else{
    const old=[...$('singles').querySelectorAll('.srow')].find(el=>el.dataset.char===c);
    if(!old){buildPoly();return;}
    const row=buildWordRow(c,DB[c].p[0],true);
    old.replaceWith(row);
    updateSinglesSummary();
    if(focus&&focus.type==='wadd'){
      const wi=row.querySelector('.wadd');
      if(wi)wi.focus();
    }
  }
}
function buildPoly(){
  const box=$('poly');box.innerHTML='';
  const sbox=$('singles');sbox.innerHTML='';
  if(!DB)return;
  const list=chars().filter(c=>DB[c]);
  list.filter(c=>isPoly(c)).forEach(c=>box.appendChild(buildPolyCard(c)));

  const singles=list.filter(c=>!isPoly(c));
  if(singles.length){
    const missingCount=singles.filter(c=>wordsOf(c,DB[c].p[0]).length===0).length;
    const det=document.createElement('details');det.className='sbox';
    const initOpen=singlesOpen!==null?singlesOpen:missingCount>0;
    det.open=initOpen;
    det.addEventListener('toggle',()=>{if(det.open!==initOpen||singlesOpen!==null)singlesOpen=det.open;});
    const sum=document.createElement('summary');
    const sl=document.createElement('div');sl.className='slist';
    singles.forEach(c=>sl.appendChild(buildWordRow(c,DB[c].p[0],true)));
    det.append(sum,sl);
    sbox.appendChild(det);

function layoutSheet(items,per){
  const fillBlank=(per===4)||(items.length<per);
  let headH=8.5,stepGap=fillBlank?2.0:2.2,minBlockGap=fillBlank?3.5:1.6;
  const specs=items.map(c=>{
    const s=DB[c].s,n=s.length,cnt=n+1,wrapped=n>=PAGE.WRAP_MIN;
    const row1=wrapped?Math.ceil(cnt/2):cnt;
    const wMaxX=Math.min(wrapped?12:13,Math.floor(((PAGE.CONTENT_W+(row1-1)*PAGE.BORDER)/row1)*10)/10);
    return {c,s,n,cnt,wrapped,row1,wMaxX};
  });
  let wrapCap=fillBlank?11.0:(per===5?11.5:10.5);
  const measure=(hh,sg,bg,wc)=>{
    let sum=0;
    specs.forEach(sp=>{
      const w=sp.wrapped?Math.min(sp.wMaxX,wc):sp.wMaxX;
      const sh=sp.wrapped?(2*w-PAGE.BORDER):w;
      sum+=hh+sh+sg+PAGE.CELL;
    });
    return sum+Math.max(0,specs.length-1)*bg;
  };
  const wrappedSpecs=specs.filter(sp=>sp.wrapped);
  if(wrappedSpecs.length&&measure(headH,stepGap,minBlockGap,wrapCap)>PAGE.BODY_H){
    headH=8.0;stepGap=1.8;minBlockGap=fillBlank?2.5:1.2;
    const fixedH=specs.reduce((acc,sp)=>acc+headH+stepGap+PAGE.CELL+(sp.wrapped?0:sp.wMaxX),0)+Math.max(0,specs.length-1)*minBlockGap;
    const availPerWrap=(PAGE.BODY_H-fixedH)/wrappedSpecs.length;
    wrapCap=Math.max(7.5,Math.min(wrapCap,Math.floor(((availPerWrap+PAGE.BORDER)/2)*10)/10));
  }
  const blockHeights=specs.map(sp=>{
    const w=sp.wrapped?Math.min(sp.wMaxX,wrapCap):sp.wMaxX;
    const stepsH=sp.wrapped?(2*w-PAGE.BORDER):w;
    return {w,stepsH,h:headH+stepsH+stepGap+PAGE.CELL};
  });
  const totalContentH=blockHeights.reduce((a,b)=>a+b.h,0);
  let blockGap=minBlockGap;
  if(!fillBlank&&specs.length>1){
    const slack=(PAGE.BODY_H-totalContentH)/(specs.length-1);
    blockGap=Math.max(minBlockGap,Math.min(13.5,slack));
  }
  let y=PAGE.PAD_Y+PAGE.TOP_H;
  const blocks=specs.map((sp,idx)=>{
    const bh=blockHeights[idx];
    const gapAfter=idx<specs.length-1?blockGap:0;
    const blk={
      c:sp.c,s:sp.s,n:sp.n,wrapped:sp.wrapped,row1:sp.row1,
      w:bh.w,stepsH:bh.stepsH,headH,stepGap,y,
      stepsY:y+headH,
      pracY:y+headH+bh.stepsH+stepGap,
      h:bh.h,gapAfter
    };
    y+=bh.h+gapAfter;
    return blk;
  });
  const usedBodyH=y-(PAGE.PAD_Y+PAGE.TOP_H);
  const blankYs=[];
  let blankTopGap=0,blankRowGap=PAGE.BLANK_ROW_GAP;
  if(fillBlank){
    const rem=PAGE.BODY_H-usedBodyH;
    const desiredRows=Math.min(PAGE.MAX_BLANK_ROWS,Math.max(0,6-items.length));
    const maxFitRows=Math.floor((rem-PAGE.BLANK_TOP_MIN+PAGE.BLANK_ROW_MIN)/(PAGE.CELL+PAGE.BLANK_ROW_MIN));
    const rows=Math.min(desiredRows,Math.max(0,maxFitRows));
    if(rows>0){
      const needStd=PAGE.BLANK_TOP_GAP+rows*PAGE.CELL+(rows-1)*PAGE.BLANK_ROW_GAP;
      if(needStd<=rem){
        blankTopGap=PAGE.BLANK_TOP_GAP;
        blankRowGap=PAGE.BLANK_ROW_GAP;
      }else{
        const availGaps=rem-rows*PAGE.CELL;
        blankTopGap=Math.max(PAGE.BLANK_TOP_MIN,Math.min(PAGE.BLANK_TOP_GAP,Math.floor((availGaps/rows)*10)/10));
        blankRowGap=rows>1?Math.max(PAGE.BLANK_ROW_MIN,Math.min(PAGE.BLANK_ROW_GAP,Math.floor(((availGaps-blankTopGap)/(rows-1))*10)/10)):PAGE.BLANK_ROW_GAP;
      }
      let by=y+blankTopGap;
      for(let r=0;r<rows;r++){
        blankYs.push(by);
        by+=PAGE.CELL+blankRowGap;
      }
    }
  }

const PDF_PT=72/25.4;
const STRIP_DPI=300;
const STRIP_MM=STRIP_DPI/25.4;
const HEAD_PAD_TOP=1.0;
const KT_FONT='"Kaiti SC","KaiTi","PingFang SC","Microsoft YaHei",sans-serif';
const stripPt=p=>p*0.3528*STRIP_MM;
function pNum(n){const r=Math.round(n*100)/100;return r===0?'0':String(r);}
function pScale(n){const r=Math.round(n*100000)/100000;return r===0?'0':String(r);}
function svgPathToPdf(d){
  const tok=String(d||'').match(/[MmLlHhVvQqCcZz]|-?(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?/g);
  if(!tok)return '';
  const out=[];
  let i=0,cmd='',cx=0,cy=0,sx=0,sy=0;
  const num=()=>parseFloat(tok[i++]);
  const isCmd=t=>/^[MmLlHhVvQqCcZz]$/.test(t);
  while(i<tok.length){
    if(isCmd(tok[i]))cmd=tok[i++];
    else if(!cmd)break;
    if(cmd==='M'||cmd==='m'){
      const rel=cmd==='m';
      const x=num()+(rel?cx:0),y=num()+(rel?cy:0);
      out.push(pNum(x)+' '+pNum(y)+' m');
      cx=sx=x;cy=sy=y;
      cmd=rel?'l':'L';
    }else if(cmd==='L'||cmd==='l'){
      const rel=cmd==='l';
      const x=num()+(rel?cx:0),y=num()+(rel?cy:0);
      out.push(pNum(x)+' '+pNum(y)+' l');
      cx=x;cy=y;
    }else if(cmd==='H'||cmd==='h'){
      const x=num()+(cmd==='h'?cx:0);
      out.push(pNum(x)+' '+pNum(cy)+' l');
      cx=x;
    }else if(cmd==='V'||cmd==='v'){
      const y=num()+(cmd==='v'?cy:0);
      out.push(pNum(cx)+' '+pNum(y)+' l');
      cy=y;
    }else if(cmd==='Q'||cmd==='q'){
      const rel=cmd==='q';
      const qx=num()+(rel?cx:0),qy=num()+(rel?cy:0);
      const x=num()+(rel?cx:0),y=num()+(rel?cy:0);
      const c1x=cx+(2/3)*(qx-cx),c1y=cy+(2/3)*(qy-cy);
      const c2x=x+(2/3)*(qx-x),c2y=y+(2/3)*(qy-y);
      out.push(pNum(c1x)+' '+pNum(c1y)+' '+pNum(c2x)+' '+pNum(c2y)+' '+pNum(x)+' '+pNum(y)+' c');
      cx=x;cy=y;
    }else if(cmd==='C'||cmd==='c'){
      const rel=cmd==='c';
      const x1=num()+(rel?cx:0),y1=num()+(rel?cy:0);
      const x2=num()+(rel?cx:0),y2=num()+(rel?cy:0);
      const x=num()+(rel?cx:0),y=num()+(rel?cy:0);
      out.push(pNum(x1)+' '+pNum(y1)+' '+pNum(x2)+' '+pNum(y2)+' '+pNum(x)+' '+pNum(y)+' c');
      cx=x;cy=y;
    }else if(cmd==='Z'||cmd==='z'){
      out.push('h');
      cx=sx;cy=sy;
      cmd='';
    }else{
      break;
    }
  }
  return out.join(' ');
}
function pdfCellOps(xMm,yMm,mm,strokePaths,upto,mode){
  const lw=PAGE.BORDER,inner=mm-2*lw;
  const ix=(xMm+lw)*PDF_PT,iy=(PAGE.H-(yMm+mm-lw))*PDF_PT,iw=inner*PDF_PT;
  const s=iw/1024,mx=ix+iw/2,my=iy+iw/2;
  const ops=[
    'q',
    pNum(ix)+' '+pNum(iy)+' '+pNum(iw)+' '+pNum(iw)+' re W n',
    '0.863 0.604 0.573 RG '+pNum(18*s)+' w ['+pNum(26*s)+' '+pNum(22*s)+'] 0 d',
    pNum(mx)+' '+pNum(iy+iw)+' m '+pNum(mx)+' '+pNum(iy)+' l S',
    pNum(ix)+' '+pNum(my)+' m '+pNum(ix+iw)+' '+pNum(my)+' l S'
  ];
  if(mode!=='none'&&strokePaths&&strokePaths.length){
    ops.push(pScale(s)+' 0 0 '+pScale(s)+' '+pNum(ix)+' '+pNum(iy+124*s)+' cm');
    if(mode==='full'||mode==='ghost'){
      ops.push(mode==='full'?'0.133 g':'0.839 g');
      for(let i=0;i<strokePaths.length;i++)if(strokePaths[i])ops.push(strokePaths[i]+' f');
    }else if(mode==='step'){
      if(upto>1){
        ops.push('0.784 g');
        const lim=Math.min(upto-1,strokePaths.length);
        for(let i=0;i<lim;i++)if(strokePaths[i])ops.push(strokePaths[i]+' f');
      }
      if(upto>=1&&upto<=strokePaths.length&&strokePaths[upto-1]){
        ops.push('0 g');
        ops.push(strokePaths[upto-1]+' f');
      }
    }
  }
  ops.push('Q');
  const bx=(xMm+lw/2)*PDF_PT,by=(PAGE.H-(yMm+mm-lw/2))*PDF_PT,bw=(mm-lw)*PDF_PT;
  ops.push(pNum(bx)+' '+pNum(by)+' '+pNum(bw)+' '+pNum(bw)+' re S');
  return ops.join('\n');
}
function pdfPlaceImg(name,xMm,yMm,wMm,hMm){
  const tx=xMm*PDF_PT,ty=(PAGE.H-(yMm+hMm))*PDF_PT;
  return 'q '+pNum(wMm*PDF_PT)+' 0 0 '+pNum(hMm*PDF_PT)+' '+pNum(tx)+' '+pNum(ty)+' cm /'+name+' Do Q';
}
function buildPageStream(lay,gh,strokeCache,headNames,topName){
  const ops=[];
  if(topName)ops.push(pdfPlaceImg(topName,PAGE.PAD_X,PAGE.PAD_Y,PAGE.CONTENT_W,PAGE.TOP_H));
  lay.blocks.forEach((b,idx)=>{
    const hn=headNames&&headNames[idx];
    if(hn)ops.push(pdfPlaceImg(hn,PAGE.PAD_X,b.y-HEAD_PAD_TOP,PAGE.CONTENT_W,b.headH+HEAD_PAD_TOP));
  });
  ops.push('0.267 G '+pNum(PAGE.BORDER*PDF_PT)+' w [] 0 d');
  const X0=PAGE.PAD_X,pracPitch=PAGE.CELL-PAGE.BORDER;
  lay.blocks.forEach(b=>{
    let sp=strokeCache.get(b.c);
    if(!sp){sp=b.s.map(svgPathToPdf);strokeCache.set(b.c,sp);}
    const stepPitch=b.w-PAGE.BORDER;
    ops.push(pdfCellOps(X0,b.stepsY,b.w,sp,0,'full'));
    for(let k=1;k<b.row1;k++)ops.push(pdfCellOps(X0+k*stepPitch,b.stepsY,b.w,sp,k,'step'));
    if(b.wrapped){
      const y2=b.stepsY+stepPitch;
      for(let k=b.row1;k<=b.n;k++)ops.push(pdfCellOps(X0+(k-b.row1)*stepPitch,y2,b.w,sp,k,'step'));
    }
    for(let k=0;k<PAGE.COLS;k++)ops.push(pdfCellOps(X0+k*pracPitch,b.pracY,PAGE.CELL,sp,0,k<gh?'ghost':'none'));
  });
  lay.blankYs.forEach(by=>{
    for(let k=0;k<PAGE.COLS;k++)ops.push(pdfCellOps(X0+k*pracPitch,by,PAGE.CELL,[],0,'none'));
  });
  return ops.join('\n');
}
function measureHeadEntries(ctx,entries,pyBase,sc){
  let total=0;
  entries.forEach((e,idx)=>{
    ctx.font=stripPt(pyBase*sc)+'px Arial,"PingFang SC",sans-serif';
    total+=ctx.measureText(e.p).width;
    if(e.w.length){
      ctx.font=stripPt(13.5*sc)+'px '+KT_FONT;
      total+=1.8*sc*STRIP_MM+ctx.measureText(e.w.join(' ')).width;
    }
    if(idx<entries.length-1)total+=4.5*sc*STRIP_MM;
  });
  return total;
}
async function deflateBytes(u8){

  }

}
async function canvasToFlateImage(cv,gray){
  const w=cv.width,h=cv.height;
  const rgba=cv.getContext('2d',{willReadFrequently:true}).getImageData(0,0,w,h).data;
  const raw=new Uint8Array(w*h*(gray?1:3));
  if(gray){
    for(let i=0,j=0;i<rgba.length;i+=4,j++)raw[j]=Math.round(0.299*rgba[i]+0.587*rgba[i+1]+0.114*rgba[i+2]);
  }else{
    for(let i=0,j=0;i<rgba.length;i+=4,j+=3){raw[j]=rgba[i];raw[j+1]=rgba[i+1];raw[j+2]=rgba[i+2];}
  }
  return {w,h,gray:Boolean(gray),data:await deflateBytes(raw)};
}

    let x=0;
    entries.forEach((e,idx)=>{
      ctx.fillStyle='#c0392b';ctx.font=stripPt(pyBase*sc)+'px Arial,"PingFang SC",sans-serif';
      ctx.fillText(e.p,x,y);
      x+=ctx.measureText(e.p).width;
      if(e.w.length){
        const ws=e.w.join(' ');
        x+=1.8*sc*STRIP_MM;
        ctx.fillStyle='#333';ctx.font=stripPt(13.5*sc)+'px '+KT_FONT;
        ctx.fillText(ws,x,y);
        x+=ctx.measureText(ws).width;
      }
      if(idx<entries.length-1)x+=4.5*sc*STRIP_MM;
    });
  }
  return canvasToFlateImage(cv,false);
}
function makePdf(pages,sharedImages){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=b=>{const u=typeof b==='string'?enc.encode(b):b;parts.push(u);len+=u.length;};
  const obj=(n,body)=>{offs[n]=len;push(n+' 0 obj\n'+body+'\nendobj\n');};
  const streamObj=(n,dict,data)=>{
    offs[n]=len;
    push(n+' 0 obj\n'+dict+'\nstream\n');
    push(data);
    push('\nendstream\nendobj\n');
  };
  const imgObj=(n,im)=>{
    const cs=im.gray?'/DeviceGray':'/DeviceRGB';
    streamObj(n,'<</Type/XObject/Subtype/Image/Width '+im.w+'/Height '+im.h+'/ColorSpace'+cs+'/BitsPerComponent 8/Filter/FlateDecode/Length '+im.data.length+'>>',im.data);
  };
  let nextId=3;
  const sharedList=Object.entries(sharedImages||{}).map(([name,im])=>({name,im,id:nextId++}));
  const pagePlans=pages.map(pg=>{
    const pageId=nextId++;
    const imgs=Object.entries(pg.images||{}).map(([name,im])=>({name,im,id:nextId++}));
    const contentId=nextId++;
    return {pageId,imgs,contentId,stream:pg.stream};
  });
  push('%PDF-1.4\n');
  push(new Uint8Array([0x25,0xe2,0xe3,0xcf,0xd3,0x0a]));
  obj(1,'<</Type/Catalog/Pages 2 0 R>>');
  obj(2,'<</Type/Pages/Kids['+pagePlans.map(p=>p.pageId+' 0 R').join(' ')+']/Count '+pagePlans.length+'>>');
  sharedList.forEach(s=>imgObj(s.id,s.im));
  pagePlans.forEach(p=>{
    const xobjs=[...sharedList,...p.imgs].map(x=>'/'+x.name+' '+x.id+' 0 R').join(' ');
    const res=xobjs?'<</XObject<<'+xobjs+'>>>>':'<<>>';
    obj(p.pageId,'<</Type/Page/Parent 2 0 R/MediaBox[0 0 595.28 841.89]/Resources'+res+'/Contents '+p.contentId+' 0 R>>');
    p.imgs.forEach(x=>imgObj(x.id,x.im));
    streamObj(p.contentId,'<</Filter/FlateDecode/Length '+p.stream.length+'>>',p.stream);
  });
  const xr=len,total=nextId;
  push('xref\n0 '+total+'\n0000000000 65535 f \n');
  for(let n=1;n<total;n++)push(String(offs[n]).padStart(10,'0')+' 00000 n \n');
  push('trailer\n<</Size '+total+'/Root 1 0 R>>\nstartxref\n'+xr+'\n%%EOF\n');
  return new Blob(parts,{type:'application/pdf'});
}
function syncFromInput(){
  const key=chars().join('');
  if(key!==lastCharKey){lastCharKey=key;buildPoly();}
  render();
}
function flushInput(){
  if(inpTimer){clearTimeout(inpTimer);inpTimer=null;syncFromInput();}
}
function busy(b){$('bprint').disabled=b;$('bpdf').disabled=b;$('bmd').disabled=b;}
function doPrint(){
  flushInput();
  const {ok}=cur();if(!ok.length){$('msg').textContent='请先输入生字';return;}
  fitHeads();
  window.print();
}
async function exportPdf(){
  flushInput();
  const {ok,per,gh}=cur();if(!ok.length){$('msg').textContent='请先输入生字';return;}
  busy(true);$('msg').textContent='正在生成 PDF…';
  const cv=document.createElement('canvas');
  try{
    const dt=selectedDateInfo();
    const topImg=await renderTopStrip(cv,dt);
    const enc=new TextEncoder();
    const strokeCache=new Map();
    const pages=[];
    const totalPages=Math.ceil(ok.length/per);
    for(let i=0,pIdx=0;i<ok.length;i+=per,pIdx++){
      if(totalPages>1)$('msg').textContent='正在生成 PDF（'+(pIdx+1)+'/'+totalPages+'）…';
      const lay=layoutSheet(ok.slice(i,i+per),per);
      const images={},headNames=[];
      for(let j=0;j<lay.blocks.length;j++){
        const b=lay.blocks[j];
        const hn='H'+j;
        headNames.push(hn);
        images[hn]=await renderHeadStrip(cv,b.c,b.n,b.headH);
      }
      const rawStream=buildPageStream(lay,gh,strokeCache,headNames,'Top');
      const stream=await deflateBytes(enc.encode(rawStream));
      pages.push({stream,images});
      await new Promise(r=>setTimeout(r,0));
    }
    $('msg').textContent='';
    await saveFile('汉字练习_'+today()+'.pdf',makePdf(pages,{Top:topImg}));
  }catch(e){$('msg').textContent='生成失败：'+(e.message||e);}
  finally{cv.width=0;cv.height=0;busy(false);}
}
function escMd(s){return String(s).replace(/\|/g,'\\|');}
function buildMd(){
  flushInput();
  const {ok}=cur();
  let m='# 生字练习表\n\n生字：'+ok.map(c=>{
    const pys=activeEntries(c).map(e=>e.p).join(' / ');
    return c+(pys?'（'+pys+'）':'');
  }).join('、')+'\n\n| 序号 | 汉字 | 拼音 | 例词 | 笔画数 |\n| --- | --- | --- | --- | --- |\n';
  ok.forEach((c,i)=>{
    const entries=activeEntries(c);
    const pyCol=escMd(entries.map(e=>e.p).join(' / '));
    const showPrefix=isPoly(c)&&entries.length>1;
    const wdCol=escMd(entries.filter(e=>e.w.length).map(e=>(showPrefix?e.p+'：':'')+e.w.join('、')).join('；'));
    m+='| '+(i+1)+' | '+c+' | '+pyCol+' | '+wdCol+' | '+DB[c].s.length+' |\n';
  });
  const dt=selectedDateInfo();
  m+='\n生成日期：'+(dt.blank?localDateParts().label:dt.label)+'\n';
  return m;
}
async function exportMd(){
  flushInput();
  const {ok}=cur();if(!ok.length){$('msg').textContent='请先输入生字';return;}
  await saveFile('汉字练习_'+today()+'.md',new Blob([buildMd()],{type:'text/markdown'}));
}
